[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tempmail-cf"
version = "0.1.0"
description = "CLI for disposable email addresses on Cloudflare Email Routing, Workers, D1 and Slack"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Walleson Rodrigues" }]
keywords = ["cloudflare", "email", "temporary", "disposable", "slack", "otp"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
  "Topic :: Security",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/wallesonrodrigues/tempmail"

[project.scripts]
tempmail = "tempmail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tempmail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
